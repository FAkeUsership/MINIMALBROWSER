# ---- JVM ----
# GitHub Actions supplies the Android build environment. GeckoView is a large
# bundled browser dependency, so the runner keeps a modest but reliable heap.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# ---- AndroidX ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Kotlin ----
kotlin.code.style=official
