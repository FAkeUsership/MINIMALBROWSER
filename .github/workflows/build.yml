name: Build Minimal Browser

# A v* tag builds the ARM64 bundled-engine APK on GitHub and publishes it to
# the matching release. No local Gradle build is part of the release path.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create or update (for example: v1.2.3)'
        required: true
        default: 'v1.2.3'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minimal-browser:
    name: Minimal Browser (bundled GeckoView ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - uses: gradle/actions/setup-gradle@v4

      # Retain the Android SDK. Only unrelated hosted tools are removed to make
      # headroom for Mozilla's large native engine dependency.
      - name: Free non-Android disk headroom
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Assemble ARM64 bundled-engine APK
        working-directory: minimal-browser
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify generated APK contents
        run: |
          set -euo pipefail
          APK=minimal-browser/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$AAPT2" dump badging "$APK" | tee /tmp/minimal-browser-badging.txt
          grep -Eq "^package: name='com\.minimal\.browser'.*versionName='1\.2\.3'" /tmp/minimal-browser-badging.txt
          grep -Eq "native-code:.*'arm64-v8a'" /tmp/minimal-browser-badging.txt
          # Assert against the built APK, not source: exactly the requested ABI
          # and Gecko's main native library must be present.
          unzip -l "$APK" | tee /tmp/minimal-browser-zip.txt
          grep -Eq 'lib/arm64-v8a/libxul\.so$' /tmp/minimal-browser-zip.txt
          ! grep -Eq 'lib/(armeabi-v7a|x86|x86_64|riscv64)/' /tmp/minimal-browser-zip.txt
          # Install-time extraction is deliberate for Gecko's companion libs.
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | \
            grep -Eq 'extractNativeLibs.*(0xffffffff|true)'
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK_BYTES=$APK_BYTES"
          test "$APK_BYTES" -gt 80000000
          ls -lh "$APK"

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          cp minimal-browser/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            release/MinimalBrowser-arm64-v8a-debug.apk
          (
            cd release
            sha256sum MinimalBrowser-arm64-v8a-debug.apk > SHA256SUMS.txt
          )
          ls -lh release
          cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) ;;
            *) echo "release_tag must begin with v (received: $TAG)" >&2; exit 1 ;;
          esac
          NOTES="Minimal Browser $TAG corrects the v1.2.2 black-screen regression while retaining the bundled Mozilla GeckoView ARM64 engine. GeckoView's already-initialized default SurfaceView is used directly; v1.2.2 redundantly reset that backend after its SurfaceHolder listener was registered, which prevented the compositor from receiving its surface callback. This release restores the field-proven APK packaging profile, retains the one-Back page-only fix, removes automatic full-frame tab screenshots, coalesces shield-event UI/database work, indexes local blocking rules, and disables remote debugging. The release verifies the generated package ID, version, ARM64-only native code, libxul.so, install-time native extraction, checksum, and a substantial bundled-engine artifact. Web navigation/search, Home links including Mail and YouTube, tabs, downloads, printing, and page-only mode use the bundled engine. Hold Web for exactly 5 seconds; one Android Back or a page double-tap restores controls and normal system bars. SHA256SUMS.txt verifies the APK. App ID: com.minimal.browser."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Minimal Browser $TAG" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
