name: Build Minimal Browser

# A v* tag builds the Android APK on GitHub and publishes it to that Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create or update (for example: v1.1.0)'
        required: true
        default: 'v1.1.0'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minimal-browser:
    name: Minimal Browser (Android System WebView)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - uses: gradle/actions/setup-gradle@v4

      # Deliberately retain the Android SDK. The original broken workflow deleted
      # its own SDK before Gradle ran.
      - name: Free non-Android disk headroom
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Assemble
        working-directory: minimal-browser
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=minimal-browser/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | tee /tmp/minimal-browser-badging.txt
          grep -Eq "^package: name='com\.minimal\.browser'" /tmp/minimal-browser-badging.txt
          # A System WebView build must not accidentally carry the retired native engine.
          ! unzip -l "$APK" | grep -Eq 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libxul\.so'
          ls -lh "$APK"

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          cp minimal-browser/app/build/outputs/apk/debug/app-debug.apk \
            release/MinimalBrowser-android-debug.apk
          (
            cd release
            sha256sum MinimalBrowser-android-debug.apk > SHA256SUMS.txt
          )
          ls -lh release
          cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) ;;
            *) echo "release_tag must begin with v (received: $TAG)" >&2; exit 1 ;;
          esac
          NOTES="Minimal Browser $TAG replaces the crashing bundled native engine with Android System WebView. Web, Tabs, page-only mode, YouTube, Mail links, downloads, and Android Back run through the stable platform browser renderer. SHA256SUMS.txt verifies the published APK. App ID: com.minimal.browser."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Minimal Browser $TAG" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
