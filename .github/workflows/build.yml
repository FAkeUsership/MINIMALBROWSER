name: Build Minimal Browser

# A v* tag builds the ARM64 bundled-engine APK on GitHub and publishes it to
# the matching release. No local Gradle build is part of the release path.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create or update (for example: v1.2.6)'
        required: true
        default: 'v1.2.6'
        type: string
      publish_release:
        description: 'Publish release assets after verification (disable for a GitHub Actions validation run)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minimal-browser:
    name: Minimal Browser (bundled GeckoView ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - uses: gradle/actions/setup-gradle@v4

      # Retain the Android SDK. Only unrelated hosted tools are removed to make
      # headroom for Mozilla's large native engine dependency.
      - name: Free non-Android disk headroom
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Assemble signed ARM64 bundled-engine release APK
        working-directory: minimal-browser
        run: |
          set -euo pipefail
          # The project intentionally keeps no private signing key. Generate the
          # standard Android debug certificate only on this disposable GitHub
          # runner so the non-debuggable release variant is sideloadable.
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify generated APK contents
        run: |
          set -euo pipefail
          APK=minimal-browser/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT2" dump badging "$APK" | tee /tmp/minimal-browser-badging.txt
          grep -Eq "^package: name='com\.minimal\.browser'.*versionName='1\.2\.6'" /tmp/minimal-browser-badging.txt
          # Assert against the generated APK, rather than source, that it is a
          # non-debuggable release process even though it is debug-key-signed.
          ! grep -Eq '^application-debuggable' /tmp/minimal-browser-badging.txt
          grep -Eq "native-code:.*'arm64-v8a'" /tmp/minimal-browser-badging.txt
          # Assert against the built APK, not source: exactly the requested ABI
          # and Gecko's main native library must be present.
          unzip -l "$APK" | tee /tmp/minimal-browser-zip.txt
          grep -Eq 'lib/arm64-v8a/libxul\.so$' /tmp/minimal-browser-zip.txt
          ! grep -Eq 'lib/(armeabi-v7a|x86|x86_64|riscv64)/' /tmp/minimal-browser-zip.txt
          # Install-time extraction is deliberate for Gecko's companion libs.
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | \
            grep -Eq 'extractNativeLibs.*(0xffffffff|true)'
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK_BYTES=$APK_BYTES"
          test "$APK_BYTES" -gt 80000000
          ls -lh "$APK"

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          cp minimal-browser/app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            release/MinimalBrowser-arm64-v8a-release.apk
          (
            cd release
            sha256sum MinimalBrowser-arm64-v8a-release.apk > SHA256SUMS.txt
          )
          ls -lh release
          cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) ;;
            *) echo "release_tag must begin with v (received: $TAG)" >&2; exit 1 ;;
          esac
          NOTES="Minimal Browser $TAG is a signed, non-debuggable Android release variant with the bundled Mozilla GeckoView ARM64 engine. v1.2.6 adds practical physical keyboard and mouse handling: when Android reports a USB/Bluetooth hardware keyboard, native address, Home, Settings, and prompt fields do not request the software IME; dynamic input-device/configuration changes refresh that behavior; and a Gecko text-input delegate declines an IME request for an engine-owned page field without clearing the page field's focus. Physical Enter and numpad Enter submit the address and Home search fields once. Familiar browser shortcuts are source-implemented: Ctrl+L/F6 address, Ctrl+T normal tab, Ctrl+Shift+N private tab, Ctrl+W close, Ctrl+Tab switch, Ctrl+R/F5 reload, Ctrl+F find, Ctrl+H history, Ctrl+J Downloads, Ctrl+P print, Alt+left/right history navigation, plus the keyboard Menu key. Ordinary page keys, clicks, right-clicks, and scroll-wheel input continue to Gecko; mouse Back/Forward side buttons navigate with Android key-event duplicate protection. The established working drawer, private tabs, confirmed stream-based Android Downloads, native blank-tab search surface, status-bar preference, page-only five-second hold, OAuth/consent compatibility, default ETP, local blocking, performance reductions, and ARM64-only bundled engine remain. The release verifies APK signature, package ID, version, non-debuggable process flag, ARM64-only native code, libxul.so, install-time native extraction, checksum, and a substantial bundled-engine artifact. GitHub compilation/package verification is not physical USB/Bluetooth keyboard and mouse validation; test those devices after installation. The disposable-runner debug certificate is not a durable update identity, so export data and uninstall an older differently signed build if Android rejects the update. SHA256SUMS.txt verifies the APK. App ID: com.minimal.browser."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Minimal Browser $TAG" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
